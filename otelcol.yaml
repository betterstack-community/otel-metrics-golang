receivers:
  otlp:
    protocols:
      http:
        endpoint: otel-metrics-demo-collector:4318

processors:
  attributes/betterstack:
    actions:
      - key: better_stack_source_token
        value: hcJiu2kPaKuUo6ggFa59uWG4
        action: insert
  batch:

exporters:
  prometheus:
    endpoint: localhost:3000

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
